    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        .admin-form {
            max-width: 400px;
            margin: auto;
            background-color: hsl(246, 86%, 28%);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
        }
        select{
            width: 100%;
            padding: 10px;
            margin-bottom: 16px;
            box-sizing: border-box;
            color: black;
            background-color: white;

        }

        button {
            background-color: #4CAF50;
            color: white;
            padding: 4px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4CAF50;
        }
    </style>
</head>
<body>

    <div class="admin-form">
        <h2>Admin Page</h2>

        <form  method="POST" action="" enctype="multipart/form-data">
            <label for="category">Emotion Type:</label>
            <select id="emotion" name="emotion" required>
                <option value="sad">Sad</option>
                <option value="happy">Happy</option>
                <option value="love">Love</option>
                <option value="depression">Depression</option>
                <option value="optimism">optimism</option>
            </select>

            <label for="file">Select File:</label>
            <input type="file" id="file" name="file" accept=".mp3" required>

            <button type="submit" name="submit" >Upload Song</button>
        </form>
    </div>
</body>
</html>
